{% extends 'faceit_base.html' %}
{% block title %}Reset password | Aoe4IT{% endblock %}
{% block content %}
<section class="auth-shell auth-shell-single">
  <section class="auth-card-faceit auth-card-narrow">
    <div class="auth-card-head">
      <div>
        <div class="auth-label">Recovery</div>
        <h2>Choose new password</h2>
      </div>
      <div class="auth-head-actions">
        <a class="small-btn alt" href="{{ url_for('login') }}">Log in</a>
      </div>
    </div>

    <form method="post" class="auth-form-grid">{{ csrf_input() }}
      <label>
        <span>New password</span>
        <input type="password" name="password" required autocomplete="new-password">
      </label>
      <label>
        <span>Confirm new password</span>
        <input type="password" name="confirm_password" required autocomplete="new-password">
      </label>
      <button class="cta-primary auth-submit" type="submit">Update password</button>
    </form>

    <div class="auth-footer-links">
      <a href="{{ url_for('login') }}">Back to log in</a>
    </div>
  </section>
</section>
{% endblock %}
