{% extends 'faceit_base.html' %}
{% block title %}Forgot password | Aoe4IT{% endblock %}
{% block content %}
<section class="auth-shell auth-shell-single">
  <section class="auth-card-faceit auth-card-narrow">
    <div class="auth-card-head">
      <div>
        <div class="auth-label">Recovery</div>
        <h2>Forgot password</h2>
      </div>
      <div class="auth-head-actions">
        <a class="small-btn alt" href="{{ url_for('login') }}">Log in</a>
      </div>
    </div>

    <form method="post" class="auth-form-grid">{{ csrf_input() }}
      <label>
        <span>Account email</span>
        <input type="email" name="email" required autocomplete="email">
      </label>
      <button class="cta-primary auth-submit" type="submit">Send reset link</button>
    </form>

    <div class="auth-footer-links">
      <a href="{{ url_for('login') }}">Back to log in</a>
    </div>
  </section>
</section>
{% endblock %}
